# CI (M15): lint, types, and the offline tests inside the deployment image, with no network.
# Actions are pinned by commit SHA (the tag is in the comment).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: ruff
        run: ruff check kaful tests scripts
      - name: mypy (kaful strict, tests standard; see pyproject.toml)
        run: mypy
      - name: eval recordings are committed (needs the git checkout; skipped inside the image)
        run: python -B -m pytest -q -p no:cacheprovider tests/unit/test_kaful_eval_recordings.py

  tests-in-image:
    runs-on: ubuntu-24.04
    # The suite takes ~4 min locally; one local run stalled for hours (a worker-pool test, not reproduced).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - name: build the test image (the runtime image plus dev dependencies and tests)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          target: test
          tags: kaful-test:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pytest -q, offline (no network in the container; hard rule 1)
        run: docker run --rm --network none kaful-test:ci
      - name: build the runtime image (the deployment unit)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          target: runtime
          tags: kaful:ci
          load: true
          cache-from: type=gha
      - name: the runtime image starts
        run: docker run --rm --network none kaful:ci --help
