# Golden labels for understand on cnc_spindle (PLAN M7). PRE-FILLED DRAFT: Claude's suggestions from
# the legacy checkpoints and the raw text; nothing here is checked yet. Natalie sets every `verdict`.
# Channels come from Fanuc's readable data (diagnosis screen, pp. 200-201); MTConnect only names and types them (decision 2026-11-05). No sampling rate is documented.
schema_version = 1
machine_id = "cnc_spindle"
status = "reviewed"

# 1. Legacy schema fields (outputs/schema/final_schema.json). Is each a channel the machine reports?
#    verdict: channel | not_channel | unsure; role (channels): observation | operating_input |
#    usage_clock | event. `suggested_*` and `why` are Claude's pre-fill; set `verdict` (and `role`).
#    usage_clock is the machine's time axis: one running total, at most one per machine. A
#    command or setpoint is an operating_input; the measured value is an observation.
#    secondary_role: operating_input | observation, for a channel that plays both (decided
#    2026-11-06; e.g. spindle load); blank otherwise.

