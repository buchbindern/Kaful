id = "cnc_instances"
description = """One quantity on two pages is one channel (sensor_channels v6, 2026-11-08). The Fanuc diagnosis screen,
p200 (label 176), and the SERVO GUIDE data list, p730 (label 706), both name the load meter. CNC run
20261108T213530Z-ecb5ac reported it from both pages. (Second-spindle copies are dropped in code from machine.toml
[instances], not by the prompt. The motor temperature / motor winding temperature pair is left out: whether they are
one quantity was a judgement, not stated.) The two chunks as the understand context renders them, from ingest run
20261106T145913Z-245058."""
tags = ["golden", "over_extraction", "cnc"]

[inputs]
context = { file = "sources/cnc_instances.txt" }

[[golden]]
metric = "quantity_once"
field = "channels[].name"
compare = "at_most_once"
expected = ["load meter"]
