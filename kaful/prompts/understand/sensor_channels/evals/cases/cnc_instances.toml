id = "cnc_instances"
description = """Instances and repeated quantities (sensor_channels v6, 2026-11-08). The Fanuc diagnosis screen, p200
(label 176), lists every value for a first and a second spindle; the SERVO GUIDE data list, p730 (label 706), names
some of the same quantities again (load meter, motor temperature) and prints no units. This machine has one spindle.
CNC run 20261108T213530Z-ecb5ac reported 6 second-spindle copies and both pages' load meters. The two chunks as the
understand context renders them, from ingest run 20261106T145913Z-245058."""
tags = ["golden", "over_extraction", "cnc"]

[inputs]
instances = "spindle: 1"
context = { file = "sources/cnc_instances.txt" }

[[golden]]
metric = "no_instance_copies"
field = "channels[].name"
compare = "excludes_all"
expected = ["second"]

[[golden]]
metric = "quantity_once"
field = "channels[].name"
compare = "at_most_once"
expected = ["load meter", "motor temperature"]
