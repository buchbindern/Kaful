id = "eversys_carriers"
description = """Carriers (M7b, 2026-11-09): the eversys_gradual source plus p51-52 (labels equal pages), with
milk_system and water_filter left out of the component list, as a components step that missed them would pass it
(M7: run 21c0ec never extracted milk_system; the air_compressor run 19e094 missed six maintenance-schedule parts).
The water filter, which a warning entry says to change (W-014, p114 (label 114)), must come back as a carrier
quoted from the source, with its exhaustion mode; no carrier may repeat a given component or be a non-part (the
drip tray and touch screen are golden not-a-component). The milk system is expected no longer (Natalie,
2026-11-09, option A): it is named only in passing by a residue sentence (p52), and Haiku proposed no carrier for
it in three runs; that is a known gap (PLAN M7b). In real runs the components step finds milk_system; the hold-out
gap was maintenance-schedule parts, which v4 handles."""
tags = ["golden", "eversys", "carriers"]

[inputs]
context = { file = "sources/eversys_carriers.txt" }
components = """- brewing_chamber: Brewing chamber
- ceramic_grinders: Ceramic grinders
- coffee_boiler: Coffee boiler
- coffee_outlet: Coffee outlet
- steam_boiler: Steam boiler
- steam_wand: Steam wand"""
channels = """- cleaning_event: Each automatic cleaning run, logged in the cleaning history.
- coffee_counter: Count of coffee products dispensed.
- error_event: Error (E-XXX), stop (S-XXX) and warning (W-XXX) messages logged in the error history.
- milk_counter: Count of milk products dispensed.
- product_counter: Running total of products dispensed, the counter all usage is measured against."""

[[golden]]
metric = "carrier_found"
field = "carriers[].id"
compare = "contains_all"
expected = ["filter"]

[[golden]]
metric = "carrier_modes"
field = "fault_modes[].component"
compare = "contains_all"
expected = ["filter"]

[[golden]]
metric = "gradual_recall"
field = "fault_modes[].component"
compare = "contains_all"
expected = ["coffee_boiler", "steam_boiler", "steam_wand"]

[[golden]]
metric = "no_given_carriers"
field = "carriers[].id"
compare = "not_in"
expected = ["brewing_chamber", "ceramic_grinders", "coffee_boiler", "coffee_outlet", "steam_boiler", "steam_wand"]

[[golden]]
metric = "no_invented_carriers"
field = "carriers[].name"
compare = "excludes_all"
expected = ["drip tray", "touch screen", "tablet", "detergent", "beans", "sensor"]
