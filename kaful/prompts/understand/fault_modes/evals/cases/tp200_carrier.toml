id = "tp200_carrier"
description = """Carriers (M7b, 2026-11-09): tiny_pump with the inlet cartridge filter (F1) left out of the component
list. The manual's filter section (p2) states clogging (filter_dp rises) and a replacement interval, so the
clogging mode must come with a carrier whose id carries the designation F1, quoted from the source, and keep
filter_dp as its observable. No carrier may repeat a given component or be a sensor (pump bearings, "sealed
for life" with a rated life on p3, are a part and are not penalized)."""
tags = ["golden", "carriers"]

[inputs]
context = { file = "sources/tp200_context.txt" }
components = """- booster_pump_p1: booster pump (P1)
- impeller: impeller
- wear_ring: wear ring"""
channels = """- discharge_pressure: discharge_pressure (bar), range 0 to 10
- filter_dp: filter_dp (bar), differential pressure across F1, range 0 to 2
- flow_rate: flow_rate (m3/h), range 0 to 12
- inlet_pressure: inlet_pressure (bar), range 0 to 10
- motor_current: motor_current (A), range 0 to 10
- motor_temperature: motor_temperature (degC), range 0 to 120
- vibration_rms: vibration_rms (mm/s), measured on the pump bearing housing, range 0 to 20"""

[[golden]]
metric = "carrier_found"
field = "carriers[].id"
compare = "contains_all"
expected = ["f1"]

[[golden]]
metric = "carrier_modes"
field = "fault_modes[].observable_by[]"
compare = "contains_all"
expected = ["filter_dp"]

[[golden]]
metric = "no_given_carriers"
field = "carriers[].id"
compare = "not_in"
expected = ["booster_pump_p1", "impeller", "wear_ring"]

[[golden]]
metric = "no_invented_carriers"
field = "carriers[].name"
compare = "excludes_all"
expected = ["sensor", "transmitter", "gauge", "controller"]
