id = "understand.fault_modes"
version = 4
description = "M7 (v4 M7b: carriers): how each component degrades or fails: mechanism, effect, the conditions that drive it and the channels that show it, with evidence quotes."
output_model = "models:FaultModeExtraction"
max_tokens = 16000
mode = "sync"
inputs = ["channels", "components", "context"]

[segments]
system = { file = "system.md", cache = "5m" }
context = { file = "context.md", cache = "5m" }
task = { file = "task.md" }

[thresholds]
schema_valid = { min = 1.0 }
first_attempt_valid = { min = 0.8 }
fault_mode_recall = { min = 1.0 }
filter_observed_by_dp = { min = 1.0 }
known_components = { min = 1.0 }
known_channels_driven = { min = 1.0 }
known_channels_observed = { min = 1.0 }
"evidence.verbatim" = { min = 0.8 }
"evidence.supported" = { min = 1.0 }
# v3 (2026-11-08): gradual mechanisms from warning lists and shared passages; no sudden jams.
gradual_recall = { min = 1.0 }
no_sudden_faults = { min = 1.0 }
# v4 (M7b, 2026-11-09): a part that wears but is missing from the component list is proposed as a carrier.
carrier_found = { min = 1.0 }
carrier_modes = { min = 1.0 }
no_given_carriers = { min = 1.0 }
no_invented_carriers = { min = 1.0 }
"carrier_evidence.verbatim" = { min = 0.8 }
"carrier_evidence.supported" = { min = 1.0 }
