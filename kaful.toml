# Kaful settings. Environment variables override these:
# KAFUL_<NAME>, and KAFUL_SANDBOX__<NAME> for the [sandbox] table.

# Relative to the repository root.
machines_dir = "machines"
# Per-run API budget in USD when `kaful run` gets no --budget.
default_budget_usd = 10.0
log_level = "INFO"

[sandbox]
# Wall-clock limit for one sandboxed call.
timeout_s = 60.0
# CPU-seconds limit (RLIMIT_CPU) for the child process.
cpu_limit_s = 120
# stdout and stderr are each truncated to this many bytes in the result.
max_output_bytes = 65536
# PYTHONHASHSEED for the child, so generated code runs deterministically.
hash_seed = 0
# memory_limit_mb is unset: RLIMIT_AS is unreliable on macOS.

[llm]
# Model for any prompt without its own entry below. Every model must be priced in pricing.toml.
default_model = "claude-sonnet-5-5"
# Pre-call budget estimate: count_tokens (exact, free, needs the network) when the transport
# can count; otherwise characters / chars_per_token_worst plus pdf_tokens_per_page_worst per page.
token_estimate = "count_tokens"
chars_per_token_worst = 2.5
pdf_tokens_per_page_worst = 3000
# Message Batches: poll interval and how long one run waits before stopping (rerun to collect).
batch_poll_s = 60.0
batch_max_wait_s = 86400.0
# Transient poll errors (network, timeout, 5xx, rate limit) in a row before the run stops cleanly;
# the batch stays saved, so a rerun collects it without paying twice.
batch_poll_max_errors = 10
# Seconds per request; a prompt can override it with request_timeout_s in its entry below.
request_timeout_s = 120.0
sdk_max_retries = 2

# Per-prompt model choice (rule 11: the cheapest model that passes the prompt's evals).
[llm.prompts."evals.judge_faithful_quote"]
# Haiku 5.5 passed the judge validation set (12/12, no false "supported") on 2026-11-03.
model = "claude-haiku-5-5"
effort = "low"

[llm.prompts."sample.list_sensor_channels"]
# Haiku 5.5 and Sonnet 5.5 both scored 1.0 on every metric (2026-11-03); Haiku costs ~20x less.
model = "claude-haiku-5-5"
effort = "low"

[llm.prompts."ingest.extract_page"]
# Routing (decided 2026-11-05): Haiku 5.5 on every LLM page; a page whose Haiku output has any
# table is re-run on Sonnet 5.5 and Sonnet's output is used. Haiku v2 passed the golden set at
# table_cells 0.90 (NSK p28 at 0.5: it writes a merged cell once); Sonnet scored 1.0 on every case.
# Pure figures, screenshots and scans stay on Haiku. Both passes are in the ledger with their route.
# A page whose Haiku reply stays invalid (e.g. a dense table that runs out of max_tokens) is
# re-run on Sonnet too (decided 2026-11-06).
model = "claude-haiku-5-5"

[llm.prompts."ingest.extract_page".escalate]
model = "claude-sonnet-5-5"
when = ["first_pass_failed", "output_has_tables"]

# Reuse (decided 2026-11-06, CNC rebuild): extract_page v3 differs from v2 only in max_tokens
# (16000 vs 8000). A v2 response that ended normally never reached 8000, so it stands for v3;
# each reused page's llm layer names the v2 request, and the ingest phase notes count them.
[llm.reuse."ingest.extract_page"]
version = 2
max_tokens = 8000

# M7 (approved 2026-11-07): components and fault_modes v2 only raised max_tokens to 16000, so
# v1 replies that ended normally (under 6000 and 8000) are valid under v2; runs note the reuse.
[llm.reuse."understand.components"]
version = 1
max_tokens = 6000

[llm.reuse."understand.fault_modes"]
version = 1
max_tokens = 8000

[understand]
# Policy (d), approved 2026-11-07: a manual whose whole text is at most 95,000 tokens (counted with
# count_tokens) goes in whole; eversys is 91,065. That leaves room for the prompt itself under Haiku's
# 100,000-token price step. Larger documentation (CNC) uses retrieval, limited by context_max_tokens.
whole_max_tokens = 95000
