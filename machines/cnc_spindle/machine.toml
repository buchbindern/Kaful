machine_id = "cnc_spindle"
display_name = "CNC machining-centre spindle"
# Provisional: M9 decides the time unit. Nothing may depend on it before M9;
# code reads it through `confirmed_time_unit()`.
time_unit = "hour"
time_unit_provisional = true

# Legacy queries.py listed m110_03_safety.pdf, which is not on disk (OVERVIEW §5); dropped.
# nsk_bearing_selection_mounting.pdf was on disk but unlisted; added for M10 (ISO 281 ratings).
[[documents]]
path = "manual/fanuc_ac_spindle_motor.pdf"
kind = "manual"

# Despite its file name this is not ISO 10816: it is a KTH master's thesis ("Study of
# vibration severity assessment for Machine Tool spindles with Condition Monitoring",
# 2015). Its values must not be cited as `standard`.
[[documents]]
path = "manual/iso_10816_vibration_severity.pdf"
kind = "other"

[[documents]]
path = "manual/mtconnect_part1.pdf"
kind = "standard"

[[documents]]
path = "manual/mtconnect_part2.pdf"
kind = "standard"

[[documents]]
path = "manual/nsk_bearing_selection_mounting.pdf"
kind = "catalogue"
