machine_id = "cnc_spindle"
display_name = "CNC machining-centre spindle"
# Confirmed 2026-11-09 (Natalie, M9): spindle running hours (no usage clock is reported); bearing L10
# converts from revolutions through the nominal speed.
time_unit = "hour"

# Legacy queries.py listed m110_03_safety.pdf, which is not on disk (OVERVIEW §5); dropped.
# nsk_bearing_selection_mounting.pdf was on disk but unlisted; added for M10 (ISO 281 ratings).
# ruled_tables = "llm" (decided 2026-11-05): these documents' ruled tables have merged cells
# (Fanuc 173 of 310 table_ruled pages, NSK 6 of 9, by an undercounting check); PyMuPDF loses the
# rows a merged cell spans, so every table_ruled page also gets the LLM layer.
[[documents]]
path = "manual/fanuc_ac_spindle_motor.pdf"
kind = "manual"
ruled_tables = "llm"

# Despite its file name this is not ISO 10816: it is a KTH master's thesis ("Study of
# vibration severity assessment for Machine Tool spindles with Condition Monitoring",
# 2015). Its values must not be cited as `standard`.
[[documents]]
path = "manual/iso_10816_vibration_severity.pdf"
kind = "literature"

[[documents]]
path = "manual/mtconnect_part1.pdf"
kind = "standard"

[[documents]]
path = "manual/mtconnect_part2.pdf"
kind = "standard"

[[documents]]
path = "manual/nsk_bearing_selection_mounting.pdf"
kind = "catalogue"
ruled_tables = "llm"

# Declared components (decisions 2026-11-08, Natalie): parts the machine has that no understand run
# extracts. The Fanuc manual names no bearings, so these come from her knowledge of the machine; the
# NSK catalogue supplies their fault modes. position_coder is declared for downstream phases. The
# understand scorer never credits a declared component (it scores extraction).
[[components]]
id = "angular_contact_bearings"
name = "Angular-contact ball bearings"
description = "Front spindle bearings: preloaded angular-contact ball bearings carrying the spindle"
category = "mechanical"
parent = "spindle_motor"
note = "from Natalie's knowledge of the machine; no machine document names them"

[[components]]
id = "cylindrical_roller_bearings"
name = "Cylindrical roller bearings"
description = "Rear spindle bearing: double-row cylindrical roller bearing carrying the spindle"
category = "mechanical"
parent = "spindle_motor"
note = "from Natalie's knowledge of the machine; no machine document names them"

[[components]]
id = "position_coder"
name = "Position coder"
description = "Spindle position coder (4096 pulses per revolution) feeding the spindle amplifier"
category = "electrical"
parent = "spindle_motor"
note = "declared for downstream phases (Natalie, 2026-11-08); no understand run extracted it"

# Instances (Natalie, 2026-11-08): one spindle; the Fanuc diagnosis screen lists a first and a second.
[instances]
spindle = 1

# M12 (Natalie 2026-11-15): a declared spindle-housing accelerometer, flagged. No machine document names a
# vibration channel; the thesis (literature) gives the zones of SIS 728000-1 / ISO TR 17243-1 for motor spindles up
# to 15 kW, measured on the spindle housing (p28, label 18), LTSC (vibration velocity RMS, 10-5000 Hz):
# A/B 0.7, B/C 1.1, C/D 1.8 mm/s for every speed class (p30, label 20, Figure 14; read from the figure, checked by eye).
# STSC (acceleration, 2-10 kHz) "reflects better problems associated with bearing condition" (p29, label 19), but
# its boundaries depend on the speed class and are only colour bands in the figure, so LTSC is used.
[[instrumentation]]
name = "spindle_housing_vibration"
description = "Vibration velocity RMS (LTSC, 10-5000 Hz) on the spindle housing near the front bearings, from a retrofitted accelerometer"
role = "observation"
dtype = "float"
unit = "mm/s"
sampling = "unknown"

[[observation]]
component = "angular_contact_bearings"
channel = "spindle_housing_vibration"
form = "linear"
reason = "Rolling-contact damage of the front bearings raises the housing vibration; at the end of its fatigue life the spindle is in zone C (short-term operation allowable) or at the C/D boundary."
y_limit = { low = 1.1, high = 1.8, source = "literature", ref = "iso_10816_vibration_severity p30 (label 20), Figure 14: zone C, from B/C 1.1 to C/D 1.8 mm/s RMS", doc_id = "iso_10816_vibration_severity", page = 30, quote = "Figure 14 Table for evaluating vibration levels on motor spindles (up to15 kW) according to SIS 728001", transcribed = true }

[[observation]]
component = "cylindrical_roller_bearings"
channel = "spindle_housing_vibration"
form = "linear"
reason = "Rolling-contact damage of the rear bearing raises the housing vibration (measured further from it, so the same zone C prior is if anything generous)."
y_limit = { low = 1.1, high = 1.8, source = "literature", ref = "iso_10816_vibration_severity p30 (label 20), Figure 14: zone C, from B/C 1.1 to C/D 1.8 mm/s RMS", doc_id = "iso_10816_vibration_severity", page = 30, quote = "Figure 14 Table for evaluating vibration levels on motor spindles (up to15 kW) according to SIS 728001", transcribed = true }

[[observation_channel]]
channel = "spindle_housing_vibration"
y_healthy = { low = 0.3, high = 0.7, source = "literature", ref = "iso_10816_vibration_severity p30 (label 20), Figure 14: zone A ends at 0.7 mm/s RMS; p113 (label 103): an in-service spindle 'just above 0.3 mm/s'", doc_id = "iso_10816_vibration_severity", page = 30, quote = "Figure 14 Table for evaluating vibration levels on motor spindles (up to15 kW) according to SIS 728001", transcribed = true }
