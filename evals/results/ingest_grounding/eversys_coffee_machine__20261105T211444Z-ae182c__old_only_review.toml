candidate_excerpt = "2.5. Coffee process flow\nDepending on the process/product, the system will take suitable quantities of beans and grind them\naccording to the product needs, supply them to the appropriate brew chamber and tamp according\nto settings. It will then brew and dispense the product according to your request.\n1.\nGrinding\nEversys - designed ceramic burrs driven by a powerful yet quiet motor, whose heat is cleverly\nchannelled away from the coffee beans, to maintain their quality, via a set of fans. Electronic\ncontrol maintains consistency of product throughout the day, ensuring optimal extraction at all\ntimes.\n2.\ne'Levelling and tamping\nAutomatic levelling is the ability to initiate a movement to the brewing chamber, create a\nvibration which enables the powder in the chamber to spread more evenly, which leads to a\nbetter, more consistent extraction. This movement is a replica of what the barista do"
